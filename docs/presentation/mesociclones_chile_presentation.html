<style>
  :root {
    --ground: #F2F3F3;
    --paper: #FFFFFF;
    --dot: rgba(35, 47, 62, 0.10);
    --ink: #232F3E;                      /* AWS Squid Ink */
    --muted: #545B64;
    --faint: #AAB7B8;
    --red: #D86613;                      /* AWS orange (accent, legible on white) */
    --blue: #0972D3;                     /* AWS blue */
    --gold: #C77700;                     /* AWS amber */
    --violet: #8C4FFF;                   /* AWS analytics purple */
    --alerce: #FF9900;
    --line: #D5DBDB;
    --chip: #EAEDED;
    --hud: rgba(255, 255, 255, 0.9);
    --hand: "Kalam", "Comic Neue", "Segoe Print", cursive;
    --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;

      --ground: #161E2D;
      --paper: #232F3E;                  /* AWS Squid Ink stage */
      --dot: rgba(255, 255, 255, 0.07);
      --ink: #F2F3F3;
      --muted: #AAB7B8;
      --faint: #4A5B6E;
      --red: #FF9900;                    /* AWS Smile orange */
      --blue: #539FE5;
      --gold: #FFB84D;
      --violet: #B48CFF;
      --alerce: #FF9900;
      --line: #37475A;
      --chip: #2B3A4D;
    --hud: rgba(35, 47, 62, 0.9);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
      --ground: #161E2D;
      --paper: #232F3E;                  /* AWS Squid Ink stage */
      --dot: rgba(255, 255, 255, 0.07);
      --ink: #F2F3F3;
      --muted: #AAB7B8;
      --faint: #4A5B6E;
      --red: #FF9900;                    /* AWS Smile orange */
      --blue: #539FE5;
      --gold: #FFB84D;
      --violet: #B48CFF;
      --alerce: #FF9900;
      --line: #37475A;
      --chip: #2B3A4D;
    --hud: rgba(35, 47, 62, 0.9);
  }

  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--ui); }
  #app {
    position: fixed; inset: 0; overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  /* the frame fills the screen; on portrait screens it is turned sideways so the wide drawing fills it */
  #frame { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
  @media (orientation: portrait) {
    #frame { width: 100vh; height: 100vw; width: 100dvh; height: 100dvw; transform: rotate(90deg) translateY(-100%); transform-origin: top left; }
  }
  svg#stage { display: block; width: 100%; height: 100%; }
  /* only links take the pointer; everything else lets clicks through to the slide (manual mode: click = next) */
  svg#stage * { pointer-events: none; }
  svg#stage a, svg#stage a * { pointer-events: auto; }
  svg text { font-family: var(--hand); fill: var(--ink); }
  svg .t-muted { fill: var(--muted); }
  svg .t-red { fill: var(--red); }
  svg .eq { font-family: var(--hand); }
  svg .t-blue { fill: var(--blue); }
  svg .t-gold { fill: var(--gold); }
  svg .t-violet { fill: var(--violet); }
  svg path, svg line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .s-ink { stroke: var(--ink); }
  .s-muted { stroke: var(--muted); }
  .s-faint { stroke: var(--faint); }
  .s-red { stroke: var(--red); }
  .s-blue { stroke: var(--blue); }
  .s-gold { stroke: var(--gold); }
  .s-violet { stroke: var(--violet); }
  .f-red { fill: var(--red) !important; }
  .f-blue { fill: var(--blue) !important; }
  .alerce-logo { fill: var(--alerce); }
  .f-gold { fill: var(--gold) !important; }
  .f-ink { fill: var(--ink) !important; }
  .f-muted { fill: var(--muted) !important; }
  .f-violet { fill: var(--violet) !important; }

  .hud {
    position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(920px, calc(100% - 32px)); box-sizing: border-box;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--hud); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: opacity 0.35s ease;
  }
  .hud.is-hidden { opacity: 0; pointer-events: none; }
  .ibtn {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid transparent;
    background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .ibtn:hover { border-color: var(--line); }
  .ibtn:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .ibtn svg { width: 15px; height: 15px; }
  input[type=range] { flex: 1; accent-color: var(--red); min-width: 110px; }
  .clock { flex: none; width: 92px; text-align: right; font: 12px var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .hud { transition: none; } }
</style>

<style>
  /* fixed widths, so the scrubber keeps its size as the slide name, the clock and the mode change; long names are cut */
  .chap { flex: none; width: clamp(90px, calc(100vw - 830px), 190px); font: 12px var(--ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 820px) { .chap { display: none; } }
  .ibtn.rate { width: auto; min-width: 36px; padding: 0 8px; border-radius: 999px; font: 600 12px var(--ui); font-variant-numeric: tabular-nums; }
  .ibtn.rate[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
  .ibtn.mode { width: 68px; padding: 0; border-radius: 999px; font: 600 12px var(--ui); }
  .ibtn.mode[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }
  /* manual-mode cue: a small arrow, grey while a step builds (wait), red once it is ready (click) */
  .slide-no { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font: 500 12px var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); opacity: 0.8; pointer-events: none; }
  .wait-hint { position: absolute; right: calc(62px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; font: 600 18px/24px var(--ui); text-align: center; color: #fff;
    background: var(--faint); opacity: 0; pointer-events: none; transition: opacity 0.3s ease, background-color 0.3s ease; }
  .wait-hint.busy { opacity: 0.8; background: var(--faint); }
  .wait-hint.on { opacity: 0.9; background: var(--red); }
  .blank { position: absolute; inset: 0; z-index: 20; display: none; }
  .blank.black { display: block; background: #000; }
  .blank.white { display: block; background: #fff; }
  .toast { position: absolute; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 15;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--hud); color: var(--ink);
    font: 500 13px var(--ui); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .help { position: absolute; inset: 0; z-index: 18; display: none; place-items: center; background: rgba(0, 0, 0, 0.35); }
  .help.on { display: grid; }
  .help-card { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box; padding: 18px 22px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); }
  .help-card h2 { margin: 0 0 10px; font: 600 16px var(--ui); }
  .help-card dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  .help-card dt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .help-card dd { margin: 0; color: var(--muted); }
  .help-card p { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .wait-hint { transition: none; } }
  /* AWS logo: dark-text version on light theme, white-text version on the Squid Ink stage */
  .aws-on-dark { display: none; }
  :root[data-theme="dark"] .aws-on-light { display: none; }
  :root[data-theme="dark"] .aws-on-dark { display: inline; }
  /* pitch: text on the fixed dark hero (contrast >= 4.5:1 on #161E2D), embeds and links */
  svg .t-white { fill: #fff; }
  svg .t-smile { fill: #FF9900; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fo-box { width: 100%; height: 100%; overflow: hidden; }
  .fo-scale { transform-origin: 0 0; }
  .fo-scale iframe { border: 0; display: block; width: 100%; height: 100%; }
  /* slide 1: the video is an HTML layer behind the SVG (full-bleed, 16:9 cover), only visible on that slide */
  svg#scene { position: relative; z-index: 1; }
  .hero-layer { position: absolute; inset: 0; overflow: hidden; background: #161E2D; visibility: hidden; pointer-events: none; }
  .hero-layer.on { visibility: visible; }
  /* local 5 s clip (assets/), cropped to the phone footage: no news banner, no player controls */
  .hero-layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  /* veil: dark on the left where the text sits, light on the right so the footage reads */
  .hero-layer::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(22, 30, 45, 0.9) 0%, rgba(22, 30, 45, 0.82) 48%, rgba(22, 30, 45, 0.25) 66%, rgba(22, 30, 45, 0.12) 100%); }
  .hero-layer.failed video { display: none; }

     personas heridas y una víctima fatal. Mensaje: el riesgo existe y no tenemos cómo verlo venir.
     El clip es local (assets/tornado_estacion_central.mp4): funciona sin internet y abriendo el archivo con doble clic. -->
<!-- NOTAS · Diapositiva 2 · ¿Qué es un mesociclón y qué datos tenemos?
     Un mesociclón es una columna de aire que gira, de 2 a 10 km, dentro de una tormenta fuerte; si persiste,
     es una supercélula. Puede dar granizo grande, ráfagas y tornados. En 2019 Chile no tenía red de radares
     (el primero, móvil, se adjudicó en 2025); satélite, reanálisis y catálogo son abiertos y están en AWS. -->
<!-- NOTAS · Diapositiva 3 · Nuestra propuesta
     Tres piezas: el predictor aprende de los tornados documentados en Chile; el visor lo muestra sin instalar
     nada; el apoyo es para meteorólogos, equipos de emergencia y comunidades. Aclarar que hoy usa datos
     históricos (ERA5 no es tiempo real) y que las alertas requieren validación y datos al instante. -->
<!-- NOTAS · Diapositiva 4 · Cómo funciona
     Diagrama interactivo (Archify, en movimiento): pasar el mouse por un nodo resalta sus conexiones; ROUTE recorre
     un camino, LENS filtra y +/- hace zoom. Al sacar el mouse del diagrama, las teclas vuelven a la presentación. Recorrer de izquierda a derecha:
     datos abiertos ERA5 y GOES, recortes, variables, modelo y visor. Cerrar con por qué AWS: los datos ya
     viven ahí, se procesa junto a ellos y se paga solo lo que se usa. Seguridad: IAM con permisos mínimos,
     Session Manager sin SSH, solo CloudFront llega al visor. -->

    T(500, 418, ["Mesociclón ciclónico gira en sentido $horario$ · SRH $negativa$","supercélulas tornádicas favorecidas: $left-movers$"], { size: 17, lh: 1.4 });
    T(500, 480, "El STP clásico no habría señalado mayo 2019 → VGP₀₋₁, SHERBE y STP austral (≤ −0,3)", { size: 14, cls: "t-muted" });
  }


  // ---------- 5 · features ----------
  { slide("Anexo · Variables derivadas");
    T(500, 110, "Resumen físico de los datos para empezar con modelos sencillos", { size: 17, cls: "t-muted", boil: true });
    const cols = [
      ["Viento", ["cizalladura 0–1, 0–3, 0–6 km","SRH (helicidad)","hodógrafo, jet de bajo nivel"], "t-blue"],
      ["Termodinámica", ["CAPE / CIN, LCL, LFC","lapse rate, agua precipitable","T en 500 hPa, SST"], "t-gold"],
      ["Índices compuestos", ["STP, SCP, EHI","VGP₀₋₁, SHERBE, BRN","(signos y ramas del sur)"], "t-red"],
      ["GOES", ["temperatura de brillo B13","topes penetrantes, flujo óptico","dBT/dt, lightning jump"], "t-violet"],
    ];
    cols.forEach((c,k)=>{ step(k); const x=60+k*232;
      D(roughRect(x, 160, 210, 230, 600+k*4), "s-ink", 1.2);
      T(x+105, 196, c[0], { size: 19, cls: c[2], boil: true });
      D(roughLine(x+30, 210, x+180, 210, 650+k, 0.02), c[2].replace("t-","s-"), 1.2);
      c[1].forEach((line,j)=> T(x+14, 244+j*30, "· "+line, { size: 13, anchor: "start", cls: "t-muted" }));
    });
    step(4);
    T(500, 430, "Un modelo tabular (gradient boosting) con pocas variables es el punto de partida", { size: 16 });
    T(500, 466, "Una red más compleja no asegura un mejor resultado con pocas etiquetas", { size: 14, cls: "t-muted" });
  }


  // ---------- 6 · model (PU learning + time-series prediction) ----------
  { slide("Modelo");
    // izquierda: PU learning
    step(0);
    T(70, 120, "Aprendizaje PU (positivos + no etiquetados)", { size: 19, cls: "t-red", anchor: "start", boil: true });
    T(70, 156, ["102 registros = ejemplos positivos.", "El resto NO es negativo: solo no está etiquetado.", "El modelo estima P(tornado) a partir del entorno,", "corrigiendo que no todo evento quedó reportado."], { size: 15, anchor: "start", lh: 1.5 });
    step(1);
    T(70, 268, "P(reportado | entorno) =", { size: 16, anchor: "start", cls: "t-blue" });
    T(90, 296, "P(tornado | entorno) × P(reportado | tornado, lugar, hora)", { size: 13, anchor: "start", cls: "t-muted" });

    // derecha: predicción en series de tiempo (diagrama)
    step(2);
    T(735, 120, "Predicción en series de tiempo", { size: 19, cls: "t-blue", boil: true });
    figure("Diagrama: ERA5 y GOES entregan una secuencia horaria; una ventana deslizante alimenta el modelo, que produce una probabilidad de rotación a lo largo del tiempo", () => {
      // franja de pasos de tiempo (ERA5 + GOES hora a hora)
      const tx = 540, ty = 180, dt = 60;
      for (let i = 0; i < 6; i++) {
        D(roughRect(tx + i * dt, ty, 44, 34, 700 + i * 3), "s-ink", 1.2);
        T(tx + i * dt + 22, ty + 22, "t" + i, { size: 12, cls: "t-muted" });
      }
      T(tx + 3 * dt, ty - 14, "ERA5 + GOES hora a hora", { size: 13, cls: "t-muted" });
      // ventana deslizante sobre las últimas horas
      D(roughRect(tx + 2 * dt - 4, ty - 6, 3 * dt - 12, 46, 760), "s-violet", 1.5, { "fill-opacity": 0.08, class: "s-violet f-violet" });
      T(tx + 3 * dt + 6, ty + 58, "ventana deslizante", { size: 12, cls: "t-violet" });
      // flecha hacia el modelo
      D(arrowPath(tx + 3 * dt + 6, ty + 80, tx + 3 * dt + 6, ty + 112, 770), "s-ink", 1.4);
      // caja del modelo
      D(roughRect(tx + 2 * dt - 10, ty + 118, 3 * dt + 2, 46, 780), "s-red", 1.6);
      T(tx + 3 * dt - 4, ty + 146, "modelo", { size: 15, cls: "t-red", boil: true });
      // flecha hacia la curva de salida
      D(arrowPath(tx + 3 * dt - 4, ty + 170, tx + 3 * dt - 4, ty + 200, 790), "s-ink", 1.4);
      // eje y curva de probabilidad de rotación en el tiempo
      const cx = tx - 10, cy = ty + 300, cw = 6 * dt;
      D(roughLine(cx, cy, cx + cw, cy, 800, 0.02), "s-ink", 1.2);
      D(roughLine(cx, cy, cx, cy - 72, 810, 0.02), "s-ink", 1.2);
      D("M" + cx + " " + (cy - 6) + " Q" + (cx + cw * 0.35) + " " + (cy - 10) + " " + (cx + cw * 0.55) + " " + (cy - 58) + " Q" + (cx + cw * 0.72) + " " + (cy - 70) + " " + (cx + cw) + " " + (cy - 20), "s-blue", 1.8, { fill: "none" });
      T(cx - 4, cy - 80, "P(rotación)", { size: 12, anchor: "start", cls: "t-blue" });
      T(cx + cw, cy + 18, "tiempo", { size: 12, anchor: "end", cls: "t-muted" });
    });
    step(3);
    T(500, 500, "Una señal compatible con rotación motiva revisión — no confirma un tornado", { size: 14, cls: "t-muted" });
  }


  // =====================================================================
  //  input + animation loop
  // =====================================================================
  function toast(msg, ms = 2000) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), ms); }

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter" || k === "n" || k === "N") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "p" || k === "P") { e.preventDefault(); prev(); }
    else if (k === "Home") { gotoSlide(0); }
    else if (k === "End") { gotoSlide(slides.length - 1); }
    else if (k === "f" || k === "F") { const el = document.getElementById("app"); if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen && el.requestFullscreen(); }
    else if (k === "t" || k === "T") { const r = document.documentElement; r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark"); if (slides[si].onTheme) slides[si].onTheme(); }
    else if (k === "d" || k === "D") { toggleDemo(); }
    else if (k === "?") { toast("← → espacio: navegar · F: pantalla completa · T: tema claro/oscuro · D: demo/captura"); }
  });
  // click = next, right click = prev (only on the stage)
  const stage = document.getElementById("stage");
  stage.addEventListener("click", e => { if (e.target.closest("a")) return; next(); });
  stage.addEventListener("contextmenu", e => { e.preventDefault(); prev(); });

  // boiling turbulence: reseed slowly for the living hand-drawn look
  const turb = document.getElementById("turb");
  let seed = 1, lastBoil = 0;
  function frame(ts) {
    if (!reduce && ts - lastBoil > 115) { lastBoil = ts; seed = seed % 6 + 1; turb.setAttribute("seed", seed); }
    requestAnimationFrame(frame);
  }
  // #N (1-based) opens slide N with all its steps shown (speaker shortcut, screenshots)
  function fromHash() {
    const n = parseInt(location.hash.slice(1), 10);
    if (!(n >= 1 && n <= slides.length)) return false;
    si = n - 1; shown = slides[si].steps - 1; render();
    return true;
  }
  window.addEventListener("hashchange", fromHash);
  if (!fromHash()) render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
