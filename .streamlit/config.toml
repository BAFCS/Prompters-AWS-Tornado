# Tema del visor (scripts/visor.py): la identidad clara de web/index.html, "Cuaderno de campo".
[theme]
base = "light"
primaryColor = "#0E6A63"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4F5"
textColor = "#0C1518"
linkColor = "#0E6A63"
borderColor = "#C9D3D6"
showWidgetBorder = true
baseRadius = "6px"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap, serif"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"
redColor = "#D2492A"
blueColor = "#4C7FB8"
orangeColor = "#C98A3C"
greenColor = "#0E6A63"
grayColor = "#64757B"
chartCategoricalColors = ["#0E6A63", "#D2492A", "#4C7FB8", "#C98A3C", "#64757B", "#33454B"]

[theme.sidebar]
backgroundColor = "#E4E9EB"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"

[server]
headless = true
